[project]
name = "aurora"
version = "0.1.0"
description = "Assistente virtual do Residencial Aurora (Google ADK + FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.9.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
aurora-api = "aurora.main:run"
aurora-restore = "aurora.restore:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aurora"]
